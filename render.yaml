# Render Blueprint for the production FastAPI service.
# Use the Render dashboard to supply every `sync: false` secret.
services:
  - type: web
    runtime: docker
    name: portfolio-lucas-api
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_INPUT_COST_PER_MILLION
        value: "0.25"
      - key: OPENAI_OUTPUT_COST_PER_MILLION
        value: "2.00"
      - key: CHAT_MONTHLY_WARNING_USD
        value: "3"
      - key: CHAT_MONTHLY_BUDGET_USD
        value: "5"
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CHAT_SERVICE_TOKEN
        sync: false
      - key: CORS_PREVIEW_ORIGIN_REGEX
        sync: false
      - key: CONTACT_FORM_ENABLED
        value: "false"
      - key: CONTACT_HMAC_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_RECIPIENT_EMAIL
        sync: false
