# Render Blueprint for the production FastAPI service.
# Use the Render dashboard to supply every `sync: false` secret.
services:
  - type: web
    runtime: docker
    name: portfolio-lucas-api
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_PREVIEW_ORIGIN_REGEX
        sync: false
      - key: CONTACT_FORM_ENABLED
        value: "false"
      - key: CONTACT_HMAC_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_RECIPIENT_EMAIL
        sync: false
